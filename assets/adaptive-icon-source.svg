<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Transparent background (Android sets backgroundColor separately) -->

  <!-- Adaptive icon safe zone is the inner 66% (~676×676), centered.
       Place a smaller 2x2 grid that fits comfortably inside. Tile = 240, gap = 24, grid = 504, TL = (260, 260) -->

  <!-- +5 (top-left) -->
  <rect x="260" y="260" width="240" height="240" rx="40" fill="#FFFFFF"/>
  <text x="380" y="431" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="132" font-weight="900" text-anchor="middle" fill="#1E9A6A">+5</text>

  <!-- +3 (top-right) -->
  <rect x="524" y="260" width="240" height="240" rx="40" fill="#FFFFFF"/>
  <text x="644" y="431" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="132" font-weight="900" text-anchor="middle" fill="#1E9A6A">+3</text>

  <!-- -1 (bottom-left) -->
  <rect x="260" y="524" width="240" height="240" rx="40" fill="#FFFFFF"/>
  <text x="380" y="695" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="132" font-weight="900" text-anchor="middle" fill="#D63A3F">-1</text>

  <!-- -2 (bottom-right) -->
  <rect x="524" y="524" width="240" height="240" rx="40" fill="#FFFFFF"/>
  <text x="644" y="695" font-family="'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="132" font-weight="900" text-anchor="middle" fill="#D63A3F">-2</text>
</svg>
